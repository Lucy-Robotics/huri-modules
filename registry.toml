# The curated HuRI modules (tier 3). Being listed here is what "verified"
# means: the entry was reviewed in a pull request to this file, and CI checks
# it (check_registry.py) on every change. See ACCEPTANCE.md for what a listing
# requires, and README.md for adding one.
#
# `source` is where the reviewed code is, one of:
#   source = { path = "packages/<package>" }
#       a curated package of this repository, installed (by `huri hub` too) as
#       git+https://github.com/Lucy-Robotics/huri-modules.git@<ref>#subdirectory=<path>
#   source = { git = "https://github.com/acme/huri-module-servo", tag = "0.1.0", submodule = "modules/servo" }
#       a verified third-party module, pinned as a git submodule at that tag and
#       installed as git+<git>@<tag> (optional key: subdirectory = "<dir>",
#       appended as #subdirectory=<dir>)
#
# `extra` (optional) is the extra of `package` the module needs, when the
# package's base install lacks it (one package, several engines: each module
# brings its own stack). `huri hub` installs "<package>[<extra>] @ <source>";
# check_registry.py checks it against the package's [tool.huri-modules.extras].
#
# The schema has one reader, huri-hub's (packages/huri-hub/huri_hub/registry.py),
# which both `huri hub` and check_registry.py use: a new key is a change there,
# released with a huri-hub version bump (RELEASING.md). Schema 2 (huri-hub
# >= 0.2) added `extra`: an older huri-hub would install a module without it.

schema = 2

[[events]]
package = "huri-events"
namespace = "huri"
source = { path = "packages/huri-events" }
verified = 2026-10-12

