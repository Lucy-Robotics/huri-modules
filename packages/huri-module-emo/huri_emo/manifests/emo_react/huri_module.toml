name = "emo_react"
summary = "Reacts to the user's emotion with HuRI's own expression as the question arrives"
input = { topic = "huri.question", event = "huri_events.question:RAGQuestion" }
output = { topic = "huri.emotion.out", event = "huri_events.emotion:Expression" }
events = ["huri-events>=0.3,<0.4"]
requires = { gpu = false, actuation = false }
huri_core = ">=0.4,<0.5"
