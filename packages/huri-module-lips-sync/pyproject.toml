[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-module-lips-sync"
version = "0.1.0"
description = "HuRI module: lip sync, ARKit blend shapes from the voice (LAM Audio2Expression), on a GPU or a CPU"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huri-core[server]>=0.4,<0.5",
  "huri-events>=0.3,<0.4",
  "numpy>=1.26,<2",
]

[project.urls]
Homepage = "https://github.com/Lucy-Robotics/huri-modules/tree/main/packages/huri-module-lips-sync"
Repository = "https://github.com/Lucy-Robotics/huri-modules"
Issues = "https://github.com/Lucy-Robotics/huri-modules/issues"

[project.optional-dependencies]
lam = [
  "torch>=2.1,<3",
  "transformers>=4.46,<5",
  "onnx>=1.16,<2",
  "onnxruntime>=1.18,<2",
  "huggingface_hub>=0.23,<1",
  "scipy>=1.11,<2",
]
piper = ["huri-module-tts[piper]>=0.2.1,<0.3", "piper-tts>=1.8,<1.9"]
dev = ["pytest>=8", "black>=24", "isort>=5", "flake8>=7", "flake8-pyproject>=1.2"]

[project.entry-points."huri.modules"]
lips = "huri_lips.module:Lips"
tts_phonemes = "huri_lips.tts:PhonemeTTS"

[tool.huri-modules.extras]
lips = "lam"
tts_phonemes = "piper"

[tool.setuptools.packages.find]
include = ["huri_lips*"]

[tool.setuptools.package-data]
huri_lips = ["huri_module.toml", "manifests/*/huri_module.toml"]
