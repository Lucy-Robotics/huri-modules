name = "lips"
summary = "Lip sync: ARKit blend shapes in step with the voice (LAM Audio2Expression), GPU or CPU"
input = { topic = "huri.audio.out", event = "huri_events.audio:Audio" }
output = { topic = "huri.lips.face", event = "huri_events.face:FaceWeights" }
events = ["huri-events>=0.3,<0.4"]
requires = { gpu = false, actuation = false }
huri_core = ">=0.4,<0.5"
