# Tool settings only. The repository root is not a distribution: what is
# installable lives in packages/* (one distribution each) and meta/ (the
# huri-modules metapackage); huri-core and huri-cli come from their own
# repositories at the refs in versions.env.

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip_gitignore = true
# huri-core is installed, not in this tree; its imports keep their own block,
# after the third-party ones, as they had in the monorepo.
known_first_party = ["huri_core"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
exclude = """
  __pycache__
  venv
  .venv
"""

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
exclude = [
  "^tests/",
  "^packages/[^/]+/tests/",
]

[tool.coverage.run]
# Coverage measures the shipped code of packages/, not its tests.
omit = ["*/tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/*/tests"]
# Benchmarks (tests/benchmarks, packages/*/tests/benchmarks) are slow and noisy:
# only `make bench` runs them. Test files are imported by path, so two packages
# can each have a tests/test_x.py (no __init__.py needed, no clash with the repo's tests).
addopts = "--ignore-glob=*/benchmarks/* --import-mode=importlib"
# The distributions in this repo (packages/*), importable from a
# plain checkout; CI and the installer also install them editable.
# "." gives tests.integration.fakes; the VAD tests' dir gives speech_signals.
pythonpath = [
  ".",
  "packages/huri-module-vad/tests",
  "packages/huri-events",
  "packages/huri-module-vad",
  "packages/huri-module-stt",
  "packages/huri-module-tag",
  "packages/huri-module-emo",
  "packages/huri-module-rag",
  "packages/huri-module-mov",
  "packages/huri-module-tts",
  "packages/huri-hub",
  "packages/huri-module-lips-sync",
  "packages/huri-module-think",
]
python_files = ["test_*.py"]
