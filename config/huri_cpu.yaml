# HuRI — local Ray Serve config (no Kubernetes)
# ============================================================================
# This is the standalone equivalent of the inline `ray.serveConfig` in
# deploy/examples/local_nvidia_amd/values.yaml, adapted to run on a single
# local Ray node started with `ray start` instead of KubeRay.
#
# Run it with:
#
#   # 1. Start a local Ray head:
#   ray start --head --num-cpus=8 --num-gpus=0
#
#   # 2. Deploy this config:
#   serve deploy config/huri_cpu.yaml
#   #    ...or run it in the foreground (starts its own Ray if none is running):
#   serve run config/huri_cpu.yaml
#
#   # 3. Tear down when done:
#   serve shutdown -y && ray stop
#
# CPU only: every deployment below has num_gpus 0, so no GPU is needed. For
# GPU placement and the env vars that go with it, see config/huri.yaml.
#
# Likewise there are no PVC volume mounts here, so the model-path /
# voice-sample env vars the chart injects from .Values.models,
# .Values.voiceAssets and workerGroups[*].containerEnv are folded into
# runtime_env.env_vars below. Relative paths resolve against the directory
# `ray start` / `serve run` is launched from: run them from the repository root
# (the layout ./install.sh downloads into), or adjust the paths. For a config
# fitted to this machine, ./install.sh writes config/huri_local.generated.yaml.
# ============================================================================

proxy_location: EveryNode
http_options:
  host: 0.0.0.0
  port: 8000

applications:
  - name: huri-app
    route_prefix: /
    import_path: huri_core.app:app
    runtime_env:
      env_vars:
        # Modules this server enables (default-deny: unset enables none).
        # Keep in step with the *Handle deployments below.
        HURI_MODULES: "vad,stt,tag,emo,eag,qag,rag,tts,mov"
        RAY_COLOR_PREFIX: "1"

        # --- Gesture sliding-window defaults (run in the HuRI CPU actor) ---
        HURI_GESTURE_CONTEXT_SEC: "2.0"
        HURI_GESTURE_MIN_CHUNK_SEC: "0.5"

        # --- TTS: Piper (module tts, deployment TTSHandle) ---
        # ONNX on CPU, ~30x faster than realtime; huri-module-tts[piper]. The
        # voice: python -m piper.download_voices --download-dir assets/models/piper en_US-lessac-medium
        # (CosyVoice3, tts_cosyvoice, needs an NVIDIA GPU: see config/huri.yaml.)
        HURI_PIPER_VOICE: assets/models/piper/en_US-lessac-medium.onnx

        # --- STT (faster-whisper) ---
        # Unset: faster-whisper downloads the "base" model. Point it at a local
        # copy (the Helm chart mounts one at this path) to run offline.
        # HURI_STT_MODEL_PATH: /models/whisper/Systran/faster-whisper-base

        # --- Gesture (EMAGE) ---
        # From .Values.models.emage.env (mountPath/repoId), at the path
        # ./install.sh downloads it to.
        HURI_EMAGE_REPO: assets/models/emage/H-Liu1997/emage_audio

        HF_HUB_DOWNLOAD_TIMEOUT: "10"

    deployments:
      # HuRI: FastAPI/WebSocket ingress + per-session router. CPU only —
      # all model work is offloaded to the handle-backed deployments below.
      - name: HuRI
        ray_actor_options:
          num_cpus: 1
          num_gpus: 0

      # STT: shared faster-whisper actor.
      - name: STTHandle
        num_replicas: 1
        ray_actor_options:
          num_cpus: 1
          num_gpus: 0

      # EMO: shared prosody-emotion actor.
      - name: EMOHandle
        num_replicas: 1
        ray_actor_options:
          num_cpus: 1
          num_gpus: 0

      # RAG: embeddings (API) + LLM client. No GPU needed.
      - name: RAGHandle
        num_replicas: 1
        ray_actor_options:
          num_cpus: 1
          num_gpus: 0
        user_config:
          # Keys of huri_rag.rag.RAGDeploymentConfig. The API key is not set
          # here: rag.py reads HURI_LLM_API_KEY (needed for llm_provider "api").
          qdrant_url: "http://localhost:6333"
          llm_provider: "ollama"          # "ollama", "vllm" or "api"
          llm_url: "http://localhost:11434"
          llm_model: "llama3.2:3b"     # an ./install.sh CPU tier
          # Same default as ./install.sh; empty embedding_url uses llm_url.
          embedding_model: "bge-m3"

      # TTS (Piper) and gesture run on CPU here too.
      - name: TTSHandle
        ray_actor_options:
          num_cpus: 1
          num_gpus: 0
      - name: MOVHandle
        ray_actor_options:
          num_cpus: 1
          num_gpus: 0
