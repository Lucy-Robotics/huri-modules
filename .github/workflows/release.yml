# Releases: merging the release PR into main is the only step.
#
# - On a pull request into main (the release PR), `plan` checks the release is
#   consistent (scripts/release_plan.py, tests/test_metapackage.py) and builds
#   and checks every distribution; the job summary says what merging will
#   publish.
# - On a push to main whose huri-modules version (meta/pyproject.toml) is not
#   tagged yet, `release` tags the merge commit and publishes the GitHub
#   release, then `publish` uploads every package whose version is not on PyPI
#   yet, then the metapackage, once a maintainer approves the `pypi`
#   environment. A push to main whose version is already tagged does nothing.
# - A failed upload: "Re-run failed jobs" on that run; or, while main is still
#   at the release commit, run this workflow by hand on main. PyPI keeps what
#   it has. Releases and uploads never run from a pull request or another ref.
#
# PyPI auth is trusted publishing (no token): every project has this
# repository, this workflow file and the `pypi` environment as its publisher
# (RELEASING.md, "Publishing setup").
name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: release plan and distributions
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      create: ${{ steps.plan.outputs.create }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      core: ${{ steps.plan.outputs.core }}
      cli: ${{ steps.plan.outputs.cli }}
      uploads: ${{ steps.plan.outputs.uploads }}
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags and the previous release, for the checks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Not `-c constraints.txt` as ci.yml: it pins the images' runtime deps only.
      - run: pip install build twine pytest "packaging>=23"
      - name: the metapackage pins the packages and the registry
        run: pytest -q tests/test_metapackage.py
      - id: plan
        run: python scripts/release_plan.py
      # The packages and the metapackage apart: it pins them, so they are
      # uploaded first.
      - run: |
          for pkg in packages/*/; do python -m build --outdir dist/packages "$pkg"; done
          python -m build --outdir dist/meta meta
      - run: twine check --strict dist/packages/* dist/meta/*
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.release == 'true'
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: tag and GitHub release
    needs: plan
    # Never from a pull request or another branch, whatever the plan says.
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.plan.outputs.release == 'true' && needs.plan.outputs.create == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: tag the merge commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          CORE: ${{ needs.plan.outputs.core }}
          CLI: ${{ needs.plan.outputs.cli }}
        # --notes comes first, the generated notes follow it.
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "huri-modules $VERSION" --latest \
            --notes "Built and tested against huri-core $CORE and HuRI-CLI $CLI." \
            --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}

  publish:
    name: upload to PyPI
    needs: [plan, release]
    # `release` is skipped when resuming (create == false): run anyway then,
    # but never after a failed plan (build, twine check) or a failed release.
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.plan.outputs.release == 'true'
      && (needs.release.result == 'success' || needs.plan.outputs.create == 'false')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/huri-modules/${{ needs.plan.outputs.version }}/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # skip-existing: a package whose version PyPI has, or a resumed upload,
      # keeps the files already there. Known caveat: the two steps are one job
      # (disjoint dirs, packages first); a new project without its pending
      # publisher fails the first step, and the metapackage then waits for the
      # resume (RELEASING.md, "Publishing setup").
      - name: the packages
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/packages/
          skip-existing: true
      # After the packages: the metapackage pins them.
      - name: the metapackage
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/meta/
          skip-existing: true

  check:
    name: installs from PyPI
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Light on purpose: no `[all]` (torch, ...). Every uploaded distribution
      # is on PyPI, and the metapackage resolves its pins to the released
      # versions.
      - name: pip install the released versions from PyPI alone
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          UPLOADS: ${{ needs.plan.outputs.uploads }}
          VERSIONS: ${{ needs.plan.outputs.versions }}
        run: |
          # PyPI's index can take a minute to show a new upload.
          retry() {
            for i in 1 2 3 4 5 6; do
              "$@" && return 0
              [ "$i" -lt 6 ] && sleep 30
            done
            return 1
          }
          for dist in $UPLOADS; do
            retry pip download --no-cache-dir --no-deps --dest "$RUNNER_TEMP/dl" "$dist"
          done
          retry pip install --no-cache-dir "huri-modules[events,hub]==$VERSION"
          python - <<'PY'
          import importlib.metadata as m, os
          expected = dict(v.split("==") for v in os.environ["VERSIONS"].split())
          for name in ("huri-modules", "huri-events", "huri-hub"):
              assert m.version(name) == expected[name], (name, m.version(name))
          PY
